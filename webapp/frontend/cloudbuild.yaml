# Builds the frontend image via Cloud Build (no local Docker needed) with a
# build-arg baked in — `gcloud builds submit --tag` alone can't pass
# --build-arg, so this is a minimal explicit build step instead.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#       --substitutions=_VITE_API_BASE="https://<backend-url>/api",_IMAGE="<region>-docker.pkg.dev/<project>/diagen/frontend:latest"
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--build-arg', 'VITE_API_BASE=${_VITE_API_BASE}', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
